Configuration:
  name: s3-connection
  Properties:
    Property:
      - name: FILE_LOG_PATH
        value: "/logs/s3-connection"
      - name: LOG_EXCEPTION_CONVERSION_WORD
        value: "%xwEx"
      - name: LOG_LEVEL_PATTERN
        value: "%5p"
      - name: LOG_DATEFORMAT_PATTERN
        value: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"
      - name: CONSOLE_LOG_PATTERN
        value: "%clr{%d{${sys:LOG_DATEFORMAT_PATTERN}}}{faint} %clr{${sys:LOG_LEVEL_PATTERN}} %clr{%pid}{magenta} %clr{---}{faint} %clr{[%15.15t]}{faint} %clr{${sys:LOG_CORRELATION_PATTERN:-}}{faint}%clr{%-40.40c{1.}}{cyan} %clr{:}{faint} %m%n${sys:LOG_EXCEPTION_CONVERSION_WORD}"
      - name: FILE_LOG_PATTERN
        value: "%d{${sys:LOG_DATEFORMAT_PATTERN}} ${sys:LOG_LEVEL_PATTERN} %pid --- ${sys:LOGGED_APPLICATION_NAME}[%t] ${sys:LOG_CORRELATION_PATTERN:-}%-40.40c{1.} : %m%n${sys:LOG_EXCEPTION_CONVERSION_WORD}"
  Appenders:
    Console:
      name: Console_Appender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: ${CONSOLE_LOG_PATTERN}
    RollingFile:
      - name: Rolling_File_Appender
        fileName: ${FILE_LOG_PATH}/s3-connection.log
        filePattern: "${FILE_LOG_PATH}/archive/s3-connection-%d{yyyy-MM-dd}-%i.log.gz"
        PatternLayout:
          pattern: ${FILE_LOG_PATTERN}
        Policies:
          TimeBasedTriggeringPolicy:
            interval: 1
          SizeBasedTriggeringPolicy:
            size: 10MB
        DefaultRollOverStrategy:
          max: 30
  Loggers:
    Logger:
      - name: dev.cloudhandson.mpft.s3.connection
        additivity: false
        level: debug
        AppenderRef:
          - ref: Console_Appender
          - ref: Rolling_File_Appender
    Root:
      level: info
      AppenderRef:
        - ref: Console_Appender
        - ref: Rolling_File_Appender
